name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint run
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
      - name: release tag check
        run: bash .github/scripts/check-release-tag_test.sh
      - name: release workflow controls
        run: bash .github/scripts/check-release-controls.sh
      - name: GOOS=darwin golangci-lint run
        run: GOOS=darwin golangci-lint run
      - name: GOOS=darwin go vet -tags integration
        run: GOOS=darwin go vet -tags integration ./...
      - name: GOOS=darwin GOARCH=arm64 go build
        run: GOOS=darwin GOARCH=arm64 go build ./...
